spring.application.name=ux-insight-gateway

# Database (overridable via DB_URL / DB_USERNAME / DB_PASSWORD environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ux_beta}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:mypassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
